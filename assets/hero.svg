<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Company Analysis — a stock ticker in, a structured research report out, in your browser on your own key, free.">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#211F1C" opacity="0.05"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#A9790A"/>
    </linearGradient>
    <linearGradient id="barMuted" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7DCC0"/>
      <stop offset="1" stop-color="#D8C79B"/>
    </linearGradient>
  </defs>

  <!-- surface -->
  <rect width="1200" height="320" fill="#FAF8F4"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#A9790A"/>
  <rect x="0" y="316" width="1200" height="4" fill="#EFE9DC"/>

  <!-- left: type block -->
  <text x="72" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.4" fill="#A9790A">OPEN SOURCE · BRING YOUR OWN KEY</text>

  <text x="70" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#211F1C">AI Company Analysis</text>

  <text x="72" y="200" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5C574E">A stock ticker in. A structured research report out —</text>
  <text x="72" y="226" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#5C574E">in your browser, on your own API key, for free.</text>

  <!-- runs-on row -->
  <text x="72" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#8A8378">RUNS FREE ON</text>
  <circle cx="212" cy="273.5" r="5" fill="#C2683B"/>
  <text x="224" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3A362F">Groq</text>
  <circle cx="292" cy="273.5" r="5" fill="#2F8080"/>
  <text x="304" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3A362F">Cerebras</text>
  <circle cx="400" cy="273.5" r="5" fill="#4A72B0"/>
  <text x="412" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3A362F">Gemini</text>
  <text x="492" y="278" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8A8378">+ any OpenAI-compatible provider</text>

  <!-- right: abstract report / chart motif -->
  <g transform="translate(0,0)">
    <!-- baseline -->
    <rect x="838" y="242" width="300" height="1.5" fill="#D8CDB4"/>
    <!-- bars: 6 analysis dimensions -->
    <rect x="846"  y="176" width="34" height="66"  rx="6" fill="url(#barMuted)"/>
    <rect x="896"  y="140" width="34" height="102" rx="6" fill="url(#bar)"/>
    <rect x="946"  y="108" width="34" height="134" rx="6" fill="url(#barMuted)"/>
    <rect x="996"  y="150" width="34" height="92"  rx="6" fill="url(#bar)"/>
    <rect x="1046" y="86"  width="34" height="156" rx="6" fill="url(#bar)"/>
    <rect x="1096" y="122" width="34" height="120" rx="6" fill="url(#barMuted)"/>
    <!-- trend dot line -->
    <polyline points="863,168 913,132 963,100 1013,142 1063,78 1113,114"
      fill="none" stroke="#211F1C" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1063" cy="78" r="4.5" fill="#A9790A"/>
    <!-- header tag -->
    <rect x="846" y="60" width="150" height="10" rx="5" fill="#211F1C" opacity="0.14"/>
    <rect x="846" y="78" width="96" height="8" rx="4" fill="#211F1C" opacity="0.08"/>
  </g>
</svg>
